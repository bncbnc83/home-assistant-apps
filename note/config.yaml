name: "Trilium Notes"
version: "0.105.0"
slug: "note"
description: "TriliumNext Notes packaged as a Home Assistant app"
url: "https://github.com/TriliumNext/Trilium"
arch:
  - amd64
startup: application
boot: auto
options:
  TZ: "UTC"
schema:
  TZ: str
ports:
  "8080/tcp": 8080
ports_description:
  "8080/tcp": "Trilium web interface"
webui: "http://[HOST]:[PORT:8080]"
environment:
  TRILIUM_DATA_DIR: "/home/node/trilium-data"
map:
  - type: addon_config
    read_only: false
    path: /home/node/trilium-data
backup: cold
io: auto
privileged: []
host_network: false
