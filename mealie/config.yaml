name: "Mealie"
version: "3.25.1"
slug: "mealie"
description: "Mealie recipe manager packaged as a Home Assistant app"
url: "https://github.com/mealie-recipes/mealie"
arch:
  - amd64
startup: application
boot: auto
options:
  TZ: "UTC"
  ALLOW_SIGNUP: false
schema:
  TZ: str
  ALLOW_SIGNUP: bool
  BASE_URL: "url?"
ports:
  "9000/tcp": 4010
ports_description:
  "9000/tcp": "Mealie web interface"
webui: "http://[HOST]:[PORT:9000]"
environment:
  API_PORT: "9000"
  API_DOCS: "false"
  DB_ENGINE: "sqlite"
map:
  - type: addon_config
    read_only: false
    path: /app/data
backup: cold
io: auto
privileged: []
host_network: false
